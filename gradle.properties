# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.2.0.88

## Mod Properties
#
# Mod identity lives here and in Kinora.java's constants (kinora-api) plus the lang files - nowhere
# else. It is expanded into neoforge.mods.toml at build time, and the tools/dev scripts read it to
# find the jar and the game folder.

# Kinora is client-only and registers no blocks, items or entities, so the id prefixes only config
# files, key categories, lang keys and resource paths. It is still best chosen once.
mod_id=kinora
mod_name=Kinora Replay
# Every jar a player installs is named <mod_jar_name>-<mod_version>-<minecraft_version>.jar
# (kinora-replay-0.1.1-26.2.jar; the sample mod adds -sample to the name). Set in kinora-mc and
# sample-mod's build.gradle from these properties, so a version bump renames the jars by itself.
mod_jar_name=kinora-replay
# kinora-api is LGPL-3.0-only so other mods may link it freely; the rest of the mod is under the
# Kinora Replay License (LICENSE): free to use, not to repost or redistribute.
mod_license=LicenseRef-Kinora-Replay AND LGPL-3.0-only
mod_version=0.1.0
mod_group_id=dev.kinora
mod_authors=Bernhard Siegl
mod_description=A director's toolkit: record gameplay as a replay, re-film it with a cinematic camera, and render frame-accurate video.
# The Gradle project that builds the mod jar, and the run task the dev scripts start.
mod_project=kinora-mc
# The singleplayer world tools/dev/mc-devclient.ps1 joins, in run/saves. Create it once through the
# game's menus: superflat, creative, cheats on.
dev_world=Test Arena

## Library versions
# Pure-Java zstd (Apache-2.0). Bundled in the mod jar through jarJar.
aircompressor_version=3.10
junit_version=6.1.3
# Provided by Minecraft at runtime; keep equal to the version Minecraft ships.
gson_version=2.14.0
